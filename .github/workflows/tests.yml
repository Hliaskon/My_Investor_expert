name: Tests

# Offline test suite (tests/) — κανένα network call προς Yahoo/FRED/SMTP,
# κανένα secret. Τρέχει σε κάθε push/PR που αλλάζει κώδικα· τα αυτόματα
# commits του screener (history.csv, snapshots/) δεν το ενεργοποιούν.
on:
  push:
    paths-ignore:
      - 'history.csv'
      - 'snapshots/**'
      - 'watchlist*.csv'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # ίδια με το screener.yml
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q tests
